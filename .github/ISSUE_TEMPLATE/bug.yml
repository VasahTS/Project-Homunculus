name: Bug
description: Something did not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! One sentence and a screenshot already help a lot. **Never paste your API key here** — issues are public.
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - Linux (AppImage)
        - Linux (.deb)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, step by step, and what showed up.
      placeholder: |
        1. I opened a chat with Lyra
        2. I clicked…
        3. Then…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: On Windows, Win + Shift + S to take one, then Ctrl + V here.
  - type: dropdown
    id: frequency
    attributes:
      label: Does it always happen?
      options:
        - Always
        - Sometimes
        - It only happened once
