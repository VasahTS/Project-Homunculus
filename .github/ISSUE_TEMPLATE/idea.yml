name: Idea
description: A suggestion, something confusing, or something that could be easier.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What is the idea?
      description: What you wanted to do and what got in the way (or what is missing).
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or examples (optional)
