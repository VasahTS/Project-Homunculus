# Homunculus 2 — "Publish release": builds the Windows installer and the Linux .deb + AppImage, signs them and
# publishes a GitHub Release with latest.json for the in-app updater (D-037, D-038). Author: CLAUDE, 2026-10-29.
# Started by hand: Actions → Publish release → Run workflow (branch main) → type the version.
# Order: check + tests + draft release → build Windows and Linux at the same time → write latest.json,
# save the new version number in main (and dev), publish. Anything failing before the end leaves nothing public.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version number (e.g. 0.2.0)"
        required: true
      notes:
        description: "What changed, in one line (optional; the CHANGELOG.md section for this version wins)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # the form's text reaches the scripts only through variables (never pasted into a command)
  INPUT_VERSION: ${{ inputs.version }}
  INPUT_NOTES: ${{ inputs.notes }}

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Only main publishes
        if: github.ref != 'refs/heads/main'
        run: |
          echo "✖ Pick the main branch in \"Use workflow from\" (dev is for daily work)."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version and signing key
        id: version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          VERSION="$(echo "$INPUT_VERSION" | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          node scripts/release/set-version.mjs "$VERSION"
          node scripts/release/release-config.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Tests (a broken build is never published)
        run: |
          npm run typecheck
          npm test

      - name: Draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release/notes.mjs "$VERSION" "$INPUT_NOTES" > release-notes.md
          # a draft left by a failed run of the same version is reused
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .name == \"Homunculus $VERSION\") | .id" | head -n1)"
          if [ -z "$ID" ]; then
            # the id comes straight from the answer (the release list can lag a few seconds behind)
            ID="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
              -f name="Homunculus $VERSION" -F body=@release-notes.md -F draft=true --jq .id)"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F body=@release-notes.md > /dev/null
          fi
          if [ -z "$ID" ]; then
            echo "✖ Could not create the draft release. Run the workflow again."
            exit 1
          fi
          echo "Draft release id: $ID"
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev libxdo-dev

      - name: Version and updater settings
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/release/set-version.mjs "$VERSION"
          node scripts/release/release-config.mjs

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build and sign
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.check.outputs.release_id }}
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.check.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: latest.json for the in-app updater
        run: |
          node scripts/release/updater-json.mjs "$VERSION" > latest.json
          cat latest.json
          # a latest.json left by an earlier try is replaced
          OLD="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .id')"
          if [ -n "$OLD" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"; fi
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" \
            -H "Content-Type: application/json" --input latest.json > /dev/null

      - name: Save the version number in main
        run: |
          node scripts/release/set-version.mjs "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml
          if ! git diff --cached --quiet; then
            git commit -m "Version $VERSION"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f tag_name="v$VERSION" \
            -f target_commitish="$RELEASE_SHA" -F draft=false -f make_latest=true > /dev/null
          echo "### Homunculus $VERSION published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Bring the version number to dev
        continue-on-error: true
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev
          git merge --no-edit "$RELEASE_SHA" -m "Version $VERSION (from main)"
          git push origin dev
