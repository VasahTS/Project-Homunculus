# Remote JannyAI may only return the pending card response. CODEX, 2026-11-02.
[[permission]]
identifier = "allow-janny-card-report"
description = "Return one bounded public-card response."
commands.allow = ["janny_card_report"]

[[permission]]
identifier = "allow-main-commands"
description = "Application commands stay available only to the local main window."
commands.allow = ["database_url", "data_location", "backup_database", "secret_get", "secret_set", "secret_delete", "save_download", "update_channel", "web_search_page", "web_get", "card_site_request", "janny_card_url", "botbooru_request", "botbooru_window"]
