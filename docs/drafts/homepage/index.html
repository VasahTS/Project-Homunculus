<!doctype html>
<!-- HomePage studies. Author: CODEX, 2026-10-29. Standalone prototype; no app integration. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Homunculus 2 · Home drafts</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#home">Skip to Home</a>
  <header class="review" lang="en">
    <div class="review-brand"><strong>Homunculus 2</strong><span>Home studies · fictional data</span></div>
    <nav aria-label="Homepage proposals" class="draft-tabs">
      <button data-draft="a" aria-pressed="true">A <span>Resume</span></button>
      <button data-draft="b" aria-pressed="false">B <span>Library</span></button>
      <button data-draft="c" aria-pressed="false">C <span>Refuge</span></button>
    </nav>
    <label class="state-control">State <select id="state"><option value="normal">In use</option><option value="full">Full library</option><option value="empty">First use</option><option value="loading">Loading</option><option value="error">Error while loading</option></select></label>
    <p id="rationale">A · The last chat comes first. Stories and conversations are one click away.</p>
  </header>
  <div class="app-shell" data-draft="a">
    <aside class="sidebar" aria-label="Sidebar"></aside>
    <div class="workspace">
      <header class="toolbar">
        <button class="icon-button menu-toggle" data-action="menu" aria-label="Toggle sidebar" aria-expanded="false"></button>
        <span class="breadcrumb">Home</span>
        <label class="search"><span id="search-icon"></span><input type="search" id="search" placeholder="Find a story or chat" aria-label="Find a story or chat"><kbd>/</kbd></label>
        <button class="quiet" data-action="create">+ New Story</button>
      </header>
      <main id="home" tabindex="-1"></main>
      <footer class="app-footer"><span>Your stories, at your pace.</span><span>Homunculus</span></footer>
    </div>
  </div>
  <dialog id="preview" aria-labelledby="modal-title"><div class="dialog-top"><span lang="en">Navigation preview · fictional data</span><button class="icon-button" id="close" aria-label="Close preview">✕</button></div><div id="modal-body"></div></dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
