  }).join('');
  const motif = kind % 4 === 0 ? `<path d="M177 296V176a53 53 0 0 1 106 0v120" fill="${dark}" stroke="${light}" stroke-width="1.1"/><path d="M187 296V178a43 43 0 0 1 86 0v118" fill="none" stroke="${light}" opacity=".5"/><path d="m229 201-7 16 7 16 7-16Z" fill="${light}"/><path d="M230 237v31m-12-18h24" stroke="${light}"/>`
    : kind % 4 === 1 ? `<path d="m103 308 75-188 42 96 31-137 104 229Z" fill="${dark}" stroke="${light}" opacity=".8"/><path d="m148 197 30-77 22 51-20-6-14 23Zm79 6 24-124 35 75-26-10Z" fill="${light}" opacity=".6"/><circle cx="338" cy="89" r="29" fill="${light}" opacity=".8"/>`
    : kind % 4 === 2 ? `<path d="M145 312V145h168v167M163 145v-35h133v35M204 110V76h46v34" fill="${dark}" stroke="${light}" opacity=".8"/><path d="M218 312v-69a15 15 0 0 1 30 0v69M180 172v27m39-27v27m40-27v27m36-27v27" fill="none" stroke="${light}"/><path d="m250 76 54 24-54 14Z" fill="${light}" opacity=".6"/>`
    : `<circle cx="232" cy="199" r="79" fill="none" stroke="${light}" opacity=".7"/><circle cx="232" cy="199" r="65" fill="none" stroke="${light}" opacity=".3"/><path d="m232 128 61 106H171Zm0 142-61-106h122Z" fill="none" stroke="${light}" opacity=".8"/><ellipse cx="232" cy="198" rx="25" ry="44" fill="${dark}" stroke="${light}"/>`;
  return `<svg viewBox="0 0 460 370" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x2="0" y2="1"><stop stop-color="${dark}"/><stop offset="1" stop-color="${mid}"/></linearGradient></defs><path fill="url(#${id})" d="M0 0h460v370H0z"/>${Array.from({length:25},(_,i)=>`<circle cx="${(i*83+25)%460}" cy="${(i*37+15)%210}" r="${i%4===0 ? 1.4 : .65}" fill="${light}" opacity=".55"/>`).join('')}<circle cx="232" cy="142" r="103" fill="none" stroke="${light}" stroke-width=".6" opacity=".3"/><path d="M0 267q70-115 160-35t135-18 165 16v140H0Z" fill="${mid}" opacity=".6"/>${trees}<path d="M0 331q90-35 190-5t270-15v59H0Z" fill="${dark}"/>${motif}<path d="M210 296q30 10 6 26t28 48h-60q-19-23 9-43t17-31Z" fill="${light}" opacity=".25"/><path d="M23 25h22m-22 0v22M437 25h-22m22 0v22M23 345h22m-22 0v-22M437 345h-22m22 0v-22" fill="none" stroke="${light}" stroke-width=".7" opacity=".6"/></svg>`;
}
const stories = [
  {id:0,name:'The Warden of the Hollow',kind:0,chats:3,chat:'Chat 2',time:'Today',messages:86,mode:'Narrated adventure',line:'Beyond the old gate, the forest had gone quiet. Even the lantern seemed to be holding its breath.'},
  {id:1,name:'A Cartographer of Lost Winters',kind:1,chats:2,chat:'Chat 1',time:'Yesterday',messages:42,mode:'Written together',line:'She unfolded the map. A coastline that had not been there yesterday now crossed the page.'},
  {id:2,name:'Letters from the Amber Court',kind:2,chats:1,chat:'Chat 1',time:'Oct 26',messages:24,mode:'Director mode',line:'An unsigned letter waited beside the cold tea. The seal belonged to a house that no longer existed.'},
  {id:3,name:'The Alchemist’s Garden',kind:3,chats:0,chat:'Chat 1',time:'Not started',messages:0,mode:'Narrated adventure',line:'A greenhouse at the edge of the city, where something blooms only after midnight.'},
  ...['The House Beneath the Willow','An Atlas of Unfinished Journeys','The Last Lighthouse on the Northern Shore','Of Moths, Moonlight and Other Small Promises','The Observatory at the End of Autumn','A Very Long Way Home Through the Sleeping Mountains','The Keeper of Impossible Things','Where the River Remembers'].map((name,i)=>({id:i+4,name,kind:i%4,chats:i%4+1,chat:`Chat ${i%3+1}`,time:'Oct 24',messages:18+i*13,mode:'Narrated adventure',line:'The path continued beyond the familiar trees. There was still time to choose another way.'})),
];
const people = ['Elowen','Silas','Mira','Rowan'];
const rationales = {a:'A · The last chat comes first. Stories and conversations are one click away.',b:'B · Stories become a visual library. Opening the Story and continuing a chat are separate actions.',c:'C · A quiet entrance, in paper and green. Fewer elements compete with the next read.'};
let draft = ['a','b','c'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a';
let state = 'normal', query = '', filter = 'all', modalReturnFocus;
const dialog = $('#preview');
const storyById = (id) => stories.find(s => s.id === Number(id)) || stories[0];
const chatCount = (count) => `${count} chat${count===1?'':'s'}`;
const storyAction = (s, label, classes = 'quiet', action = 'story') => `<button class="${classes}" data-action="${action}" data-id="${s.id}">${label}</button>`;
function sidebar() {
  $('.sidebar').innerHTML = `<div class="brand">${icon('leaf')}<span>Homunculus</span></div><nav class="side-nav" aria-label="Main navigation">${[['home','Home'],['grid','Library'],['lock','Vault']].map(([i,n])=>`<button class="side-button ${i==='home'?'active':''}" data-action="${i}" ${i==='home'?'aria-current="page"':''}>${icon(i)}${n}</button>`).join('')}</nav><section><div class="side-head"><span>Stories</span><button aria-label="New Story" data-action="create">+</button></div>${state==='empty'?'<p class="side-empty">Your stories will live here.</p>':stories.slice(0,state==='full'?8:3).map(s=>`<button class="side-story" data-action="story" data-id="${s.id}"><span class="mini-cover">${art(s.kind)}</span><span><strong>${escapeHtml(s.name)}</strong><small>${s.chats?chatCount(s.chats):'Not started'}</small></span></button>`).join('')}</section><section><div class="side-head"><span>Chats</span><button aria-label="New Chat" data-action="chat-new">+</button></div>${state==='empty'?'<p class="side-empty">A conversation starts with a character.</p>':people.slice(0,2).map(n=>`<button class="side-story" data-action="person" data-name="${n}"><span class="portrait" style="width:26px;height:26px;font-size:12px;margin:0">${n[0]}</span><span><strong>${n}</strong><small>${n==='Elowen'?'The apothecary’s window':'A quiet afternoon'}</small></span></button>`).join('')}</section><div class="side-bottom"><button class="side-button" data-action="settings">${icon('settings')}Settings</button></div>`;
}
function row(s) {return `<button class="recent-row" data-action="story" data-id="${s.id}"><span class="row-art">${art(s.kind)}</span><span class="row-copy"><span class="row-title">${escapeHtml(s.name)}</span><span class="row-sub">${chatCount(s.chats)} · ${escapeHtml(s.mode)}</span></span><span class="row-end">${s.time}<span>↗</span></span></button>`;}
function quick(action, symbol, title, sub) {return `<button class="quick-action" data-action="${action}">${icon(symbol)}<span><strong>${title}</strong><small>${sub}</small></span></button>`;}
function characters() {return `<div class="character-strip">${people.map(n=>`<button class="character" data-action="person" data-name="${n}"><span class="portrait">${n[0]}</span>${n}</button>`).join('')}</div>`;}
function resume(s) {return `<div class="continue-card"><div class="continue-copy"><span class="caption">Pick up where you left off</span><h2>${escapeHtml(s.name)}</h2><p class="meta">${s.chat} · Main branch · ${s.messages} messages</p><p class="excerpt">“${escapeHtml(s.line)}”</p><div class="hero-actions">${storyAction(s,`Continue ${s.chat} ${icon('arrow')}`,'primary','resume')}${storyAction(s,'Open Story')}</div></div><div class="continue-art">${art(s.kind)}</div></div>`;}
function renderA(items) {return `<div class="page-head"><div><h1>Welcome back.</h1><p>A familiar world, or somewhere new.</p></div><span class="meta">Your space to tell stories</span></div>${resume(items[0])}<div class="home-columns"><section><div class="section-head"><h2>More of your stories</h2><button class="quiet" data-action="all-stories">View all ${icon('arrow')}</button></div>${items.slice(1).map(row).join('')}</section><section class="start-section"><div class="section-head"><h2>Begin something new</h2></div>${quick('create','book','Create a Story','A world, a narrator, your own setup')}${quick('chat-new','chat','Start a chat','One character, one conversation')}${quick('import','import','Import a character','Bring a SillyTavern card')}<div class="characters-section"><div class="section-head" style="margin-top:26px"><h2>Familiar faces</h2><button class="quiet" data-action="grid">Library</button></div>${characters()}</div></section></div>`;}
function renderB(items) {
  const shown = items.filter(s=>filter==='all'||(filter==='active'?s.chats>0:s.chats===0));
  return `<div class="page-head shelf-head"><div><h1>Your story shelf.</h1><p>Worlds you’ve begun. Worlds still waiting.</p></div><button class="primary" data-action="create">${icon('plus')}New Story</button></div><div class="shelf-controls"><div class="filters" aria-label="Filter stories">${[['all','All Stories'],['active','In progress'],['new','Not started']].map(([v,n])=>`<button data-filter="${v}" aria-pressed="${filter===v}">${n}</button>`).join('')}</div><span>${shown.length} stories · Recently played</span></div><section class="book-grid" aria-label="Stories">${shown.map(s=>`<article class="book"><button class="book-open" data-action="story" data-id="${s.id}"><div class="book-cover">${art(s.kind)}</div><span class="book-title">${escapeHtml(s.name)}</span></button><p class="meta">${s.chats?`${chatCount(s.chats)} · ${s.time}`:'Not started yet'}</p>${storyAction(s,s.chats?`Continue ${s.chat} →`:'Open Story →','book-resume',s.chats?'resume':'story')}</article>`).join('')}</section>${shown.length?'':'<p class="no-results">No stories in this view.</p>'}<div class="shelf-bottom"><section><div class="section-head"><h2>Recent conversations</h2><button class="quiet" data-action="chat-new">New chat</button></div>${people.slice(0,2).map(n=>`<button class="compact-chat" data-action="person" data-name="${n}"><span class="portrait">${n[0]}</span><span><strong>${n}</strong><small>${n==='Elowen'?'The apothecary’s window · Today':'A quiet afternoon · Yesterday'}</small></span></button>`).join('')}</section><section><div class="section-head"><h2>From your Library</h2><button class="quiet" data-action="import">Import a card</button></div><p class="meta">The people and pieces you bring into each story.</p><div class="library-links">${['Characters','Personas','Lorebooks','Presets'].map(n=>`<button data-action="library-section" data-name="${n}">${n}</button>`).join('')}</div></section></div>`;
}
function renderC(items) {const s=items[0]; return `<div class="quiet-layout"><section class="quiet-intro"><span class="caption">A little space for other worlds</span><h1>There’s more<br>to the story.</h1><p>Return to a world you know.<br>Or leave the door open for a new one.</p><div class="quiet-illustration">${art(0,true)}</div></section><section class="quiet-list"><p class="caption">Where you left off</p><div class="quiet-feature"><h2>${escapeHtml(s.name)}</h2><p class="meta">${s.chat} · Main branch · ${s.messages} messages</p><p class="excerpt">“${escapeHtml(s.line)}”</p>${storyAction(s,`Continue ${s.chat} ${icon('arrow')}`,'primary','resume')} ${storyAction(s,'Story details')}</div>${items.slice(1,state==='full'?9:3).map(row).join('')}<div class="quiet-start"><h2>Or start somewhere new</h2>${quick('create','book','Create a Story','A setting of your own')}${quick('chat-new','chat','Start a conversation','Choose someone from your Library')}</div></section></div><div class="quiet-footer"><span>Everything you need, when you need it.</span><div class="library-links"><button data-action="all-stories">All Stories</button><button data-action="grid">Library</button><button data-action="import">Import a card</button></div></div>`;}
function renderEmpty() {return `<section class="empty-home"><div class="empty-art">${art(draft==='b'?3:0,draft==='c')}</div><h1>${draft==='b'?'Every shelf starts somewhere.':draft==='c'?'A door to somewhere else.':'Your first story starts here.'}</h1><p>Create a narrated Story, or import a character and begin a conversation. Your Library grows with you.</p><div class="empty-actions"><button class="primary" data-action="create">${icon('book')}Create a Story</button><button class="secondary" data-action="import">${icon('import')}Import a character</button></div><div class="empty-paths"><button data-action="grid">Explore the Library →</button><button data-action="settings">Set up a connection →</button></div><p class="empty-note">Stories hold a world and its setup.<br>Chats are the conversations you play within it.</p></section>`;}
function render() {
  $('.app-shell').dataset.draft=draft;
  document.documentElement.style.colorScheme=draft==='c'?'light':'dark';
  $('[data-action="menu"]').innerHTML=icon('menu'); $('#search-icon').innerHTML=icon('search');
  document.querySelectorAll('[data-draft]').forEach(b=>{if(b.tagName==='BUTTON') b.setAttribute('aria-pressed',String(b.dataset.draft===draft));});
  $('#rationale').textContent=rationales[draft]; sidebar();
  const source=stories.slice(0,state==='full'?12:4);
  const items=source.filter(s=>`${s.name} ${s.line} ${s.mode}`.toLowerCase().includes(query.toLowerCase()));
  $('#home').setAttribute('aria-busy',String(state==='loading'));
  if(state==='loading') $('#home').innerHTML='<div class="page-head"><div><h1>Opening your worlds…</h1><p>Your Stories and chats are loading.</p></div></div><div class="loading-lines" aria-hidden="true"><span></span><span></span><span></span></div>';
  else if(state==='error') $('#home').innerHTML='<section class="empty-home"><h1>Couldn’t load your stories.</h1><p>Try opening the Home again.</p><button class="primary" data-action="retry">Try again</button></section>';
  else if(state==='empty') $('#home').innerHTML=renderEmpty();
  else if(!items.length) $('#home').innerHTML='<div class="no-results"><h2>No stories found.</h2><p>Try another title or a word from a scene.</p><button class="secondary" data-action="clear">Clear search</button></div>';
  else $('#home').innerHTML=({a:renderA,b:renderB,c:renderC})[draft](items);
}
function openModal(html) {modalReturnFocus=document.activeElement;$('#modal-body').innerHTML=html;if(!dialog.open)dialog.showModal();}
function storyModal(s) {openModal(`<p class="caption">Story · ${escapeHtml(s.mode)}</p><h2 id="modal-title">${escapeHtml(s.name)}</h2><p>${escapeHtml(s.line)}</p><p class="meta">A Story is a world and its setup. Each chat follows its own path.</p><div class="modal-options">${s.chats?Array.from({length:s.chats},(_,i)=>`<button class="modal-option" data-action="resume" data-id="${s.id}" data-chat="Chat ${i+1}"><strong>Chat ${i+1} ${('Chat '+(i+1))===s.chat?'· Last played':''}</strong><span>${('Chat '+(i+1))===s.chat?s.messages:24+i*7} messages · ${i?'Main branch':'The arrival'}</span></button>`).join(''):'<p>No chats yet. Choose an opening to begin.</p>'}</div><button class="primary" data-action="new-story-chat" data-id="${s.id}">+ New Chat</button>`);}
function resumeModal(s, chat=s.chat) {openModal(`<p class="caption">${escapeHtml(s.name)} / ${escapeHtml(chat)} / Main</p><h2 id="modal-title">Back in the story.</h2><p class="meta">Narrator · Last reply</p><div class="chat-preview">${escapeHtml(s.line)}<p>Somewhere beyond the trees, a bell rang once. Elowen turned toward the sound, her hand resting on the latch.</p></div><p lang="en">In the app, this button would open exactly this chat and its current branch. Here you are only seeing the draft’s transition.</p><button class="primary" data-action="close">Return to Home</button>`);}
function action(name, data) {
  const s=storyById(data.id);
  if(name==='home'){dialog.close();query='';$('#search').value='';render();}
  else if(name==='story')storyModal(s);
  else if(name==='resume')resumeModal(s,data.chat||s.chat);
  else if(name==='create')openModal('<p class="caption">New Story</p><h2 id="modal-title">Where would you like to begin?</h2><p>Start from a character card, or give an empty world its own narrator and setup.</p><div class="modal-options"><button class="modal-option" data-action="start-from-card"><strong>From a character card</strong><span>Bring the card’s scenario and openings into a Story.</span></button><button class="modal-option" data-action="empty-story"><strong>An empty Story</strong><span>Your own setting, narrator and openings.</span></button></div>');
  else if(name==='start-from-card'||name==='chat-new')openModal(`<p class="caption">${name==='chat-new'?'New conversation':'Story from a card'}</p><h2 id="modal-title">Choose a character.</h2><div class="modal-options">${people.map(n=>`<button class="modal-option" data-action="${name==='chat-new'?'person':'card-setup'}" data-name="${n}"><strong>${n}</strong><span>Main version · From your Library</span></button>`).join('')}</div><button class="primary" data-action="import">Import a character</button>`);
  else if(name==='empty-story'||name==='card-setup')openModal(`<p class="caption">Story setup</p><h2 id="modal-title">${name==='card-setup'?`A story with ${escapeHtml(data.name)}`:'A world of your own.'}</h2><p>A narrator, a scenario and one or more openings. Preset, connection and trackers belong to this Story; each chat can override them.</p><p lang="en">This path would lead to the Story creation that already exists in the project. No Story was created in this prototype.</p><button class="primary" data-action="close">Return to Home</button>`);
  else if(name==='person')openModal(`<p class="caption">Character · Main version</p><h2 id="modal-title">${escapeHtml(data.name)}</h2><p>A familiar face from the example Library.</p><div class="chat-preview">The room smelled of rain and dried herbs. “You’re earlier than I expected,” ${escapeHtml(data.name)} said.</div><p lang="en">In the app, this path would open the chat with the chosen character.</p><button class="primary" data-action="close">Return to Home</button>`);
  else if(name==='new-story-chat')openModal(`<p class="caption">${escapeHtml(s.name)} · New Chat</p><h2 id="modal-title">Choose an opening.</h2><p>Same setup as the Story. A new chat keeps its own messages and branches.</p><div class="modal-options"><button class="modal-option" data-action="resume" data-id="${s.id}" data-chat="New Chat"><strong>Opening 1 · At the gate</strong><span>Begin with the Story’s original opening.</span></button></div>`);
  else if(name==='import')openModal('<p class="caption">Library · Import</p><h2 id="modal-title">Bring someone along.</h2><p>Import a SillyTavern character card in PNG or JSON format.</p><p lang="en">This shortcut would lead to the Library’s existing importer. The draft does not read files or change your characters.</p><button class="primary" data-action="close">Return to Home</button>');
  else if(['grid','lock','settings','library-section'].includes(name)){const title=name==='grid'?'Library':name==='lock'?'Vault':name==='settings'?'Settings':data.name;openModal(`<p class="caption">Home / ${escapeHtml(title)}</p><h2 id="modal-title">${escapeHtml(title)}</h2><p>${name==='settings'?'Connections, models and appearance.':name==='lock'?'Stories, Narrators and NPCs.':'Characters, Personas, Lorebooks, Presets and Trackers.'}</p><p lang="en">This shortcut would open the project’s existing screen. This round’s proposal only covers the Home.</p><button class="primary" data-action="close">Return to Home</button>`);}
  else if(name==='all-stories'){draft='b';filter='all';render();history.replaceState(null,'','#b');}
  else if(name==='clear'){query='';$('#search').value='';render();$('#search').focus();}
  else if(name==='retry'){state='normal';$('#state').value=state;render();}
  else if(name==='close')dialog.close();
  else if(name==='menu'){const expanded=$('.app-shell').classList.toggle('sidebar-open');$('[data-action="menu"]').setAttribute('aria-expanded',String(expanded));}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.draft){draft=b.dataset.draft;filter='all';history.replaceState(null,'',`#${draft}`);render();$('#announcement').textContent=rationales[draft];}
  else if(b.dataset.filter){filter=b.dataset.filter;render();$(`[data-filter="${filter}"]`).focus();}
  else if(b.dataset.action)action(b.dataset.action,b.dataset);
});
$('#state').addEventListener('change',e=>{state=e.target.value;query='';$('#search').value='';render();});
$('#search').addEventListener('input',e=>{query=e.target.value;render();});
$('#close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('close',()=>modalReturnFocus?.isConnected&&modalReturnFocus.focus());
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(['a','b','c'].includes(next)){draft=next;filter='all';render();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!dialog.open&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus();}if(e.key==='Escape'){$('.app-shell').classList.remove('sidebar-open');$('[data-action="menu"]').setAttribute('aria-expanded','false');}});
render();
</script>
</body>
</html>
