:root{color-scheme:light dark;--background:#f4f5f2;--surface:#fff;--surface-2:#e9ede7;--foreground:#24352c;--secondary:#59665e;--accent:#34694f;--accent-ink:#fff;--separator:#d7dfd5;--selection:#dbe8dc;--functional:#e9ede7eb;--menu:#fffffff5;--scrim:#15251c38;--floating-shadow:0 14px 50px #18271d20;--ease-out:cubic-bezier(.22,1,.36,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--dur-fast:160ms;--dur:280ms;--dur-menu:180ms;--dur-content:240ms;--ui: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;--prose:Literata,Georgia,serif}
@media(prefers-color-scheme:dark){:root{--background:#191e1c;--surface:#242b27;--surface-2:#2c352e;--foreground:#edf2ec;--secondary:#b3c0b6;--accent:#b5d4b5;--accent-ink:#203726;--separator:#414e44;--selection:#364a3b;--functional:#242b27ed;--menu:#29332bf5;--scrim:#070c086e;--floating-shadow:0 14px 50px #0005}}

function navMarkup(){return [['home','home','Home'],['library','grid','Library'],['vault','vault','Vault']].map(([area,symbol,label])=>`<button class="nav-item" data-action="nav" data-area="${area}" ${S.area===area?'aria-current="page"':''}>${icon(symbol)}${label}</button>`).join('');}
function renderSidebar(){
  $('.sidebar').innerHTML=`<div class="brand">${icon('leaf')}Homunculus</div><nav class="sidebar-nav" aria-label="Places"><span class="nav-indicator" aria-hidden="true"></span>${navMarkup()}</nav><section><div class="side-section-head"><span>Stories</span><button class="text-button" data-action="create" aria-label="Create Story">${icon('plus')}</button></div>${available().slice(0,4).map(s=>`<button class="side-item" data-action="open" data-id="${s.id}"><img class="side-thumb" src="${embeddedCovers[s.kind]}" alt=""><span><strong>${esc(s.name)}</strong><small>${s.chats?count(s):'Not started'}</small></span></button>`).join('')||'<p class="sidebar-empty">Your stories will live here.</p>'}</section><section><div class="side-section-head"><span>Conversations</span></div>${S.state==='empty'?'<p class="sidebar-empty">Choose a character to begin.</p>':people.slice(0,2).map(n=>`<button class="side-item" data-action="person" data-name="${n}"><span class="avatar">${n[0]}</span><span><strong>${n}</strong><small>${n==='Elowen'?'The apothecary’s window':'A quiet afternoon'}</small></span></button>`).join('')}</section><div class="sidebar-bottom"><button class="nav-item" data-action="settings">${icon('settings')}Settings</button></div>`;
  $('.compact-nav').innerHTML=navMarkup();updateNav(true);
}
function updateNav(first=false){
  $$('.nav-item[data-area]').forEach(b=>{if(b.dataset.area===S.area)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const active=$('.sidebar-nav [aria-current=page]'),marker=$('.nav-indicator');
  if(active&&marker){if(first)marker.style.transition='none';marker.style.transform=`translateY(${active.offsetTop}px)`;if(first){void marker.offsetHeight;marker.style.transition='';}}
}
function setBreadcrumb(){
  const s=byId(S.storyId);let html='Home';
  if(S.view==='story')html=`<button class="back" data-action="home">${icon('back')}Home</button><span class="crumb-divider">/</span><span>${esc(s.name)}</span>`;
  if(S.view==='chat')html=`<button class="back" data-action="open" data-id="${s.id}">${icon('back')}Story</button><span class="crumb-divider">/</span><span>${esc(S.chat)}</span>`;
  if(S.view==='person-chat')html=`<button class="back" data-action="home">${icon('back')}Home</button><span class="crumb-divider">/</span><span>${esc(S.person)}</span>`;
  if(S.area==='library')html='Library';if(S.area==='vault')html='Vault';$('#breadcrumbs').innerHTML=html;
}
function pageTitle(title,sub,action=true){return `<header class="page-title"><div><h1>${title}</h1><p>${sub}</p></div>${action?`<div class="title-actions">${primary(`${icon('plus')}New Story`,'create')}</div>`:''}</header>`;}
function resumeCopy(s){return `<div class="resume-copy"><span class="section-label">${icon(s.chats?'clock':'book')}${s.chats?'Continue your last chat':'Your new Story'}</span><h2>${esc(s.name)}</h2><p class="meta">${s.chats?`${s.chat} · Main branch · ${s.messages} messages`:'Not started'}</p><blockquote>“${esc(s.line)}”</blockquote><div class="resume-actions">${primary(`${s.chats?'Continue '+s.chat:'Start Story'} ${icon('arrow')}`,s.chats?'resume':'new-chat',s.id)}<button class="text-button" data-action="open" data-id="${s.id}">Open Story</button></div></div>`;}
function book(s){return `<article class="story-card" data-story="${s.id}"><button class="book-button" data-action="open" data-id="${s.id}">${cover(s)}<h3>${esc(s.name)}</h3></button><p class="meta">${S.pinned.has(s.id)?'Pinned · ':''}${s.chats?count(s):'Not started'}</p>${more(s)}<button class="text-button" data-action="${s.chats?'resume':'open'}" data-id="${s.id}">${s.chats?`Continue ${s.chat}`:'Open Story'}</button></article>`;}
function familiar(){return `<div class="familiar"><span class="familiar-label">Conversations</span>${people.slice(0,3).map(n=>`<button class="person" data-action="person" data-name="${n}"><span class="avatar">${n[0]}</span>${n}</button>`).join('')}</div>`;}
function atelier(items){const s=items[0];return `${pageTitle('Your stories.','Continue a chat, or begin a new world.')}<section class="resume" data-story="${s.id}"><button class="resume-visual" data-action="open" data-id="${s.id}" aria-label="Open ${esc(s.name)}" style="padding:0">${cover(s,'resume-art')}</button>${resumeCopy(s)}</section><section><div class="section-heading"><h2>Other worlds</h2><button class="text-button" data-action="all">All Stories</button></div><div class="story-gallery">${items.slice(1).map(book).join('')}</div></section><div class="home-bottom">${familiar()}<button class="text-button" data-action="import">${icon('import')}Import a character</button></div>`;}
function recent(s){return `<button class="recent-item" data-story="${s.id}" data-action="open" data-id="${s.id}">${cover(s,'recent-cover')}<span><strong>${esc(s.name)}</strong><small>${count(s)} · ${s.time}</small></span>${icon('arrow')}</button>`;}
function lantern(items){const s=items[0];return `${pageTitle('A world to return to.','Stories and conversations, in one place.',false)}<section class="lantern-stage" data-story="${s.id}"><button class="resume-visual" data-action="open" data-id="${s.id}" aria-label="Open ${esc(s.name)}" style="padding:0">${cover(s,'resume-art')}</button>${resumeCopy(s)}</section><div class="lantern-recent"><section><div class="section-heading"><h2>Recently opened</h2><button class="text-button" data-action="all">All Stories</button></div><div class="recent-list">${items.slice(1).map(recent).join('')}</div></section><section><div class="section-heading"><h2>Start something</h2></div><div class="quick-links"><button class="quick-link" data-action="create">${icon('book')}<span><strong>New Story</strong><small>A setting, a narrator and your setup</small></span></button><button class="quick-link" data-action="choose-chat">${icon('chat')}<span><strong>New conversation</strong><small>Choose someone from your Library</small></span></button><button class="quick-link" data-action="import">${icon('import')}<span><strong>Import a character</strong><small>Bring a SillyTavern card</small></span></button></div></section></div>`;}
function storyChatRows(s){return s.chats?Array.from({length:s.chats},(_,i)=>`<button class="chat-row" data-action="resume" data-id="${s.id}" data-chat="Chat ${i+1}"><span><strong>Chat ${i+1}${'Chat '+(i+1)===s.chat?' · Last played':''}</strong><small>${'Chat '+(i+1)===s.chat?s.messages:24+i*7} messages · Main branch</small></span>${icon('arrow')}</button>`).join(''):'<p class="meta">No chats yet. Start with an opening from this Story.</p>';}
function setup(s){return `<div class="setup-list"><div><span>How you play</span><strong>${esc(s.mode)}</strong></div><div><span>Narrator</span><strong>Simple Narrator</strong></div><div><span>Preset</span><strong>Story default</strong></div><div><span>Trackers</span><strong>World, Characters</strong></div></div>`;}
function preview(s){return `<button class="back mobile-preview-back" data-action="preview-back">${icon('back')}All Stories</button><div data-story="${s.id}">${cover(s,'preview-cover')}</div><h2>${esc(s.name)}</h2><p class="meta">${count(s)} · ${s.mode}</p><blockquote>“${esc(s.line)}”</blockquote><div class="resume-actions">${primary(s.chats?`Continue ${s.chat}`:'Start Story',s.chats?'resume':'new-chat',s.id)}<button class="text-button" data-action="open" data-id="${s.id}">Open Story</button>${more(s)}</div><div class="preview-tabs" role="tablist" aria-label="Story preview"><span class="tab-indicator" aria-hidden="true" style="transform:translateX(${S.tab==='chats'?0:100}%)"></span><button role="tab" id="tab-chats" data-tab="chats" aria-selected="${S.tab==='chats'}" aria-controls="preview-tab-panel" tabindex="${S.tab==='chats'?0:-1}">Chats</button><button role="tab" id="tab-setup" data-tab="setup" aria-selected="${S.tab==='setup'}" aria-controls="preview-tab-panel" tabindex="${S.tab==='setup'?0:-1}">Setup</button></div><div id="preview-tab-panel" role="tabpanel" aria-labelledby="tab-${S.tab}">${S.tab==='chats'?storyChatRows(s):setup(s)}</div>`;}
function workbench(items){const filtered=items.filter(s=>s.name.toLowerCase().includes(S.listQuery.toLowerCase()));if(!filtered.some(s=>s.id===S.selected)&&filtered.length)S.selected=filtered[0].id;return `${pageTitle('Stories','Select a world to see its chats and setup.')}<div class="workbench" ${S.compactPreview?'data-mobile-preview':''}><section class="story-list-panel"><label class="list-search">${icon('search')}<input id="list-search" aria-label="Filter Stories" placeholder="Filter Stories" value="${esc(S.listQuery)}"></label><div class="list-controls"><span>Recently played</span><span>${filtered.length} Stories</span></div><div class="story-list" role="listbox" aria-label="Stories"><span class="selection-marker" aria-hidden="true"></span>${filtered.map(s=>`<button class="story-list-item" role="option" data-action="select" data-id="${s.id}" aria-selected="${s.id===S.selected}" tabindex="${s.id===S.selected?0:-1}">${cover(s,'list-cover')}<span><strong>${esc(s.name)}</strong><small>${s.chats?count(s):'Not started'} · ${s.time}</small></span></button>`).join('')||'<p class="empty-list">No Stories match this title.</p>'}</div></section><section class="preview-pane" aria-label="Selected Story">${filtered.length?preview(byId(S.selected)):'<p class="meta">Try a different title.</p>'}</section></div>`;}
function placeMarker(first=false){const active=$('.story-list-item[aria-selected=true]'),marker=$('.selection-marker');if(active&&marker){if(first)marker.style.transition='none';marker.style.height=`${active.offsetHeight}px`;marker.style.transform=`translateY(${active.offsetTop}px)`;marker.style.display='';if(first){void marker.offsetHeight;marker.style.transition='';}}else if(marker)marker.style.display='none';}
function storyPage(s){return `<article class="story-page"><header class="story-heading" data-story="${s.id}">${cover(s,'story-cover')}<div><h1>${esc(s.name)}</h1><p class="meta">${esc(s.mode)} · ${s.chats?count(s):'Not started'}</p><p>${esc(s.line)}</p><div class="resume-actions">${primary(s.chats?`Continue ${s.chat}`:'Start Story',s.chats?'resume':'new-chat',s.id)}${secondary(`${icon('plus')}New Chat`,'new-chat',s.id)}${more(s)}</div></div></header><div class="story-chat-section"><section><h2>Chats</h2>${storyChatRows(s)}</section><section><h2>This Story’s setup</h2>${setup(s)}</section></div></article>`;}
function chatPage(s,name){return `<article class="reading-view"><h1>${esc(name||s.name)}</h1><p class="meta">${name?'Conversation':`${esc(S.chat)} · Main branch`} · ${name?'Main version':s.messages+' messages'}</p><div class="reading-body"><span class="speaker">${name?esc(name):'Narrator'}</span><p>${esc(name?'The room smelled of rain and dried herbs. “You’re earlier than I expected,” '+name+' said.':s.line)}</p><p>Somewhere beyond the trees, a bell rang once. Elowen turned toward the sound, her hand resting on the latch.</p></div><div id="local-messages"></div><form class="composer" id="composer"><input aria-label="Your message" placeholder="What happens next?" required maxlength="2000"><button class="primary" type="submit" aria-label="Send message">${icon('arrow')}</button></form></article>`;}

function renderContent(){
  setBreadcrumb();content.setAttribute('aria-busy',String(S.state==='loading'));
  if(S.state==='loading')content.innerHTML='<section class="loading-content"><h1>Opening your stories…</h1><p>Your Library will be ready in a moment.</p></section>';
  else if(S.state==='error')content.innerHTML=`<section class="empty-view"><h1>Stories couldn’t be loaded.</h1><p>Try opening Home again.</p>${primary('Try again','retry')}</section>`;
  else if(S.area==='library')content.innerHTML=library();
  else if(S.area==='vault')content.innerHTML=vault();
  else if(S.view==='story')content.innerHTML=storyPage(byId(S.storyId));
  else if(S.view==='chat')content.innerHTML=chatPage(byId(S.storyId));
  else if(S.view==='person-chat')content.innerHTML=chatPage(base[0],S.person);
  else if(!available().length)content.innerHTML=empty();
  else content.innerHTML=({d:atelier,e:lantern,f:workbench})[S.draft](available());
  placeMarker(true);updateNav();
}
function render(){shell.dataset.draft=S.draft;$('#sidebar-toggle').setAttribute('aria-expanded',String(matchMedia('(max-width:700px)').matches?shell.hasAttribute('data-sidebar-open'):!shell.classList.contains('sidebar-hidden')));$$('[data-draft]', $('.draft-picker')).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.draft===S.draft)));$('#direction-note').textContent=({d:'D · Open a cover and go back: the Story keeps its place. Try the + button and each cover’s menu.',e:'E · Solid content, discreet navigation. Explore Stories, Library, Vault and the + menu.',f:'F · Select without leaving the list. Switch Chats / Setup and continue a chat.'})[S.draft]+' Fictional data.';renderSidebar();renderContent();}
function closeMenus(){for(const id of ['new-menu','story-menu']){const menu=$('#'+id);if(menu.matches(':popover-open'))menu.hidePopover();}}
function openStory(id,trigger){const numeric=Number(id),rect=sourceRect(numeric,trigger);closeMenus();S.area='home';S.view='story';S.storyId=numeric;S.selected=numeric;renderContent();sharedCover(numeric,rect);content.focus({preventScroll:true});}
function goHome(){const id=S.storyId,rect=sourceRect(id);closeMenus();S.area='home';S.view='home';renderContent();sharedCover(id,rect);content.focus({preventScroll:true});}
function nav(area){closeMenus();clearFlight();S.area=area;S.view='home';shell.removeAttribute('data-sidebar-open');renderContent();fade(content.firstElementChild);content.focus({preventScroll:true});}
function selectStory(id){S.selected=Number(id);S.compactPreview=true;$$('.story-list-item').forEach(b=>{const on=Number(b.dataset.id)===S.selected;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;});placeMarker();$('.preview-pane').innerHTML=preview(byId(id));$('.workbench').setAttribute('data-mobile-preview','');fade($('.preview-pane'));}
function switchTab(tab){S.tab=tab;$$('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.tabIndex=b.dataset.tab===tab?0:-1;});$('.tab-indicator').style.transform=`translateX(${tab==='chats'?0:100}%)`;$('#preview-tab-panel').innerHTML=tab==='chats'?storyChatRows(byId(S.selected)):setup(byId(S.selected));$('#preview-tab-panel').setAttribute('aria-labelledby','tab-'+tab);fade($('#preview-tab-panel'),120);}
function menuContent(){
  $('#new-menu .menu-content').innerHTML=`<button role="menuitem" data-action="create">${icon('book')}New Story</button><button role="menuitem" data-action="choose-chat">${icon('chat')}New Conversation</button><button role="menuitem" data-action="import">${icon('import')}Import Character</button>`;
  const s=byId(menuStoryId);$('#story-menu .menu-content').innerHTML=`<button role="menuitem" data-action="pin">${icon('pin')}${S.pinned.has(s.id)?'Unpin Story':'Pin Story'}</button><button role="menuitem" data-action="duplicate">${icon('copy')}Duplicate Story</button><button role="menuitem" data-action="open-story">${icon('book')}Open Story</button>`;
}
function positionMenu(menu,trigger){const rect=trigger.getBoundingClientRect(),width=menu.offsetWidth||245,height=menu.offsetHeight||145;const left=Math.min(innerWidth-width-12,Math.max(12,rect.right-width));const below=rect.bottom+8+height<innerHeight;menu.style.left=`${Math.max(12,left)}px`;menu.style.top=`${below?rect.bottom+8:Math.max(12,rect.top-height-8)}px`;menu.style.setProperty('--origin',`${Math.max(0,Math.min(100,(rect.left+rect.width/2-left)/width*100))}% ${below?'top':'bottom'}`);}
function prepareMenu(menu,trigger){menuTriggers.set(menu.id,trigger);if(trigger.dataset.id)menuStoryId=Number(trigger.dataset.id);menuContent();menu.toggleAttribute('data-instant',instant());positionMenu(menu,trigger);}
for(const menu of $$('.action-menu')){
  menu.addEventListener('toggle',e=>{if(e.newState==='open'){const trigger=menuTriggers.get(menu.id);if(trigger)positionMenu(menu,trigger);const buttons=$$('[role=menuitem]',menu);buttons.forEach((b,i)=>b.tabIndex=i===0?0:-1);buttons[0]?.focus({preventScroll:true});}});
  menu.addEventListener('keydown',e=>{const items=$$('[role=menuitem]',menu),index=items.indexOf(document.activeElement);let next;if(e.key==='ArrowDown')next=(index+1)%items.length;if(e.key==='ArrowUp')next=(index-1+items.length)%items.length;if(e.key==='Home')next=0;if(e.key==='End')next=items.length-1;if(next!==undefined){e.preventDefault();items.forEach((b,i)=>b.tabIndex=i===next?0:-1);items[next].focus();}});
}
function openSheet(title,html){
  const current=sheet.open?{opacity:getComputedStyle(sheet).opacity,transform:getComputedStyle(sheet).transform}:null;
  const opener=document.activeElement,originMenu=opener.closest('.action-menu');
  const nextTrigger=originMenu?menuTriggers.get(originMenu.id):opener;
  closeMenus();sheetEpoch++;sheetAnimation?.cancel();sheetAnimation=null;sheet.removeAttribute('data-closing');
  if(!sheet.open)sheetTrigger=nextTrigger;
  $('#sheet-label').textContent=title;$('#sheet-content').innerHTML=html;
  if(!sheet.open)sheet.showModal();
  if(!instant()){sheetAnimation=sheet.animate(reduced()?[{opacity:current?.opacity||.5},{opacity:1}]:[current||{opacity:0,transform:'translateY(12px) scale(.97)'},{opacity:1,transform:'translateY(0px) scale(1)'}],{duration:reduced()?100:280,easing:cssToken('--ease-out')});}
  const focus=$('[autofocus]',sheet)||$('input,select,button', $('#sheet-content'));focus?.focus({preventScroll:true});
}
function closeSheet(){
  const current={opacity:getComputedStyle(sheet).opacity,transform:getComputedStyle(sheet).transform};
  const epoch=++sheetEpoch;sheetAnimation?.cancel();sheetAnimation=null;if(!sheet.open)return;sheet.setAttribute('data-closing','');
  const finish=()=>{if(sheetEpoch===epoch){sheet.close();sheetTrigger?.isConnected&&sheetTrigger.focus({preventScroll:true});}};
  if(instant()){finish();return;}
  sheetAnimation=sheet.animate(reduced()?[{opacity:current.opacity},{opacity:0}]:[current,{opacity:0,transform:'translateY(12px) scale(.97)'}],{duration:reduced()?100:200,easing:cssToken('--ease-out'),fill:'forwards'});
  sheetAnimation.finished.then(finish).catch(()=>{});
}
sheet.addEventListener('cancel',e=>{e.preventDefault();closeSheet();});
sheet.addEventListener('close',()=>{sheetAnimation?.cancel();sheetAnimation=null;});
function createSheet(){openSheet('New Story',`<h2 id="sheet-title">Begin a new Story.</h2><p>A world with its own narrator, setup and chats.</p><form id="create-form"><label class="form-field">Story name<input name="title" placeholder="Give your world a name" required maxlength="120" autofocus></label><fieldset style="border:0;padding:0;margin:22px 0"><legend style="font-size:13px;margin-bottom:10px">How do you want to play?</legend><div class="mode-group">${['Narrated adventure','Written together','Director mode'].map((mode,i)=>`<label class="mode-choice"><input type="radio" name="mode" value="${mode}" ${i===0?'checked':''}>${mode}</label>`).join('')}</div></fieldset><label class="form-field">Start from<select name="from"><option value="empty">An empty Story</option>${people.map(n=>`<option>${n}</option>`).join('')}</select></label><div class="sheet-footer">${primary('Create Story',undefined,undefined,'type="submit"')}</div></form>`);}
function choosePeople(){openSheet('New Conversation',`<h2 id="sheet-title">Who would you like to meet?</h2><p>Choose a character from your Library.</p><div class="sheet-card-picker">${people.map(n=>`<button data-action="person" data-name="${n}"><span class="avatar">${n[0]}</span><span>${n}</span></button>`).join('')}</div>`);}
function characterSheet(name){openSheet('Character',`<h2 id="sheet-title">${esc(name)}</h2><p>Main version · From your Library</p><div class="sheet-description">${name==='Elowen'?'The keeper of a small apothecary at the edge of the Hollow. She knows the old paths through the forest.':'A traveler with stories of their own, waiting for the next conversation.'}</div><div class="sheet-footer">${primary('Start Conversation','person',undefined,`data-name="${esc(name)}"`)}</div>`);}
function importSheet(){openSheet('Import Character','<h2 id="sheet-title">Bring someone along.</h2><p>Choose a SillyTavern PNG or JSON card.</p><label class="form-field">Character card<input id="import-file" type="file" accept=".png,.json"></label><p class="meta" id="import-note">Example preview: choosing a file displays its name only.</p>');}
function resume(id,chat){closeMenus();if(sheet.open)closeSheet();S.area='home';S.view='chat';S.storyId=Number(id);S.chat=chat||byId(id).chat;clearFlight();renderContent();fade(content.firstElementChild,160);content.focus({preventScroll:true});}
function newChat(id){const s=byId(id);openSheet('New Chat',`<h2 id="sheet-title">A new path in this Story.</h2><p>${esc(s.name)}. Same setup as the Story.</p><form id="new-chat-form" data-id="${s.id}"><label class="form-field">Chat name<input name="name" value="Chat ${s.chats+1}" required maxlength="80" autofocus></label><label class="form-field">Opening<select><option>At the gate</option><option>A different beginning</option></select></label><div class="sheet-footer">${primary('Start Chat',undefined,undefined,'type="submit"')}</div></form>`);}
function openCommand(){closeMenus();command.showModal();$('#command-search').value='';commandIndex=0;renderSearch('');$('#command-search').focus();}
function renderSearch(q){commandMatches=[...available().filter(s=>s.name.toLowerCase().includes(q.toLowerCase())).map(s=>({type:'story',s})),...people.filter(n=>n.toLowerCase().includes(q.toLowerCase())).map(name=>({type:'person',name}))];commandIndex=Math.min(commandIndex,Math.max(0,commandMatches.length-1));$('#command-results').innerHTML=commandMatches.map((item,i)=>`<button class="command-result" id="search-result-${i}" role="option" tabindex="-1" aria-selected="${i===commandIndex}" data-action="search-result" data-index="${i}">${item.s?cover(item.s,'result-cover'):`<span class="avatar">${item.name[0]}</span>`}<span><strong>${esc(item.s?.name||item.name)}</strong><small>${item.s?'Story · '+count(item.s):'Character'}</small></span></button>`).join('')||'<p class="empty-list">No Stories or Characters match this search.</p>';const field=$('#command-search');if(commandMatches.length)field.setAttribute('aria-activedescendant','search-result-'+commandIndex);else field.removeAttribute('aria-activedescendant');}
function chooseSearch(index){const item=commandMatches[index];if(!item)return;command.close();if(item.type==='story')openStory(item.s.id);else characterSheet(item.name);}
function handle(action,data={},trigger){
  if(action==='nav')nav(data.area);
  else if(action==='home')goHome();
  else if(action==='open'||action==='open-story')openStory(data.id??menuStoryId,trigger);
  else if(action==='resume')resume(data.id,data.chat);
  else if(action==='select')selectStory(data.id);
  else if(action==='preview-back'){S.compactPreview=false;$('.workbench').removeAttribute('data-mobile-preview');$('.story-list-item[aria-selected=true]')?.focus();}
  else if(action==='create')createSheet();
  else if(action==='choose-chat')choosePeople();
  else if(action==='import')importSheet();
  else if(action==='sheet-close')closeSheet();
  else if(action==='search')openCommand();
  else if(action==='command-close')command.close();
  else if(action==='search-result')chooseSearch(Number(data.index));
  else if(action==='person-sheet')characterSheet(data.name);
  else if(action==='person'){closeMenus();if(sheet.open)closeSheet();S.person=data.name;S.area='home';S.view='person-chat';clearFlight();renderContent();fade(content.firstElementChild);}
  else if(action==='new-chat')newChat(data.id);
  else if(action==='all'){S.area='home';S.view='home';S.state='full';$('#state').value='full';renderContent();fade(content.firstElementChild);}
  else if(action==='retry'){S.state='normal';$('#state').value='normal';render();}
  else if(action==='pin'){const id=menuStoryId,was=S.pinned.has(id);closeMenus();if(was)S.pinned.delete(id);else S.pinned.add(id);renderContent();notify(was?'Story unpinned':'Story pinned',()=>{if(was)S.pinned.add(id);else S.pinned.delete(id);renderContent();});content.focus({preventScroll:true});}
  else if(action==='duplicate'){const s=byId(menuStoryId),copy={...s,id:Date.now(),name:s.name+' — Copy',chats:0,time:'Just now'};closeMenus();S.extras.unshift(copy);renderSidebar();renderContent();notify('Story duplicated',()=>{S.extras=S.extras.filter(x=>x.id!==copy.id);renderSidebar();renderContent();});content.focus({preventScroll:true});}
  else if(action==='undo'){const fn=undo;undo=null;fn?.();$('#toast').removeAttribute('data-open');$('#announcement').textContent='Change undone';}
  else if(action==='sidebar'){if(matchMedia('(max-width:700px)').matches){const on=shell.toggleAttribute('data-sidebar-open');$('#sidebar-toggle').setAttribute('aria-expanded',String(on));}else{const hidden=shell.classList.toggle('sidebar-hidden');$('#sidebar-toggle').setAttribute('aria-expanded',String(!hidden));}}
  else if(action==='settings')openSheet('Settings','<h2 id="sheet-title">Reading preferences.</h2><p>Adjust the reading size for this preview.</p><label class="form-field">Reading size<input type="range" id="reading-size" min="15" max="22" value="17" aria-label="Reading size"></label><p class="sheet-description" id="reading-sample">Beyond the old gate, the forest had gone quiet.</p>');
  else if(action==='narrator')openSheet('Narrators','<h2 id="sheet-title">Simple Narrator</h2><p>Describes the world, voices the people you meet and leaves your choices to you.</p><div class="sheet-footer"><button class="primary" data-action="create">Create a Story</button></div>');
  else if(action==='npc')openSheet('NPCs',`<h2 id="sheet-title">People in your worlds.</h2><p>Choose a familiar face.</p><div class="sheet-card-picker">${people.map(n=>`<button data-action="person-sheet" data-name="${n}"><span class="avatar">${n[0]}</span>${n}</button>`).join('')}</div>`);
}
document.addEventListener('pointerdown',()=>{input='pointer';document.documentElement.dataset.input=input;},true);
document.addEventListener('keydown',e=>{input='keyboard';document.documentElement.dataset.input=input;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!sheet.open){e.preventDefault();if(command.open)command.close();else openCommand();}if(e.key==='Escape'&&!sheet.open&&!command.open){shell.removeAttribute('data-sidebar-open');if(matchMedia('(max-width:700px)').matches)$('#sidebar-toggle').setAttribute('aria-expanded','false');}const button=e.target.closest?.('[popovertarget]');if(e.key==='ArrowDown'&&button){e.preventDefault();const menu=$('#'+button.getAttribute('popovertarget'));prepareMenu(menu,button);if(!menu.matches(':popover-open'))menu.showPopover();}if(e.key==='Tab'){$$('.action-menu:popover-open').forEach(menu=>{menu.hidePopover();menuTriggers.get(menu.id)?.focus();});}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.draft){stopMotion();closeMenus();S.draft=b.dataset.draft;S.view='home';S.area='home';S.compactPreview=false;history.replaceState(null,'','#'+S.draft);render();return;}if(b.dataset.tab){switchTab(b.dataset.tab);return;}if(b.hasAttribute('popovertarget')){prepareMenu($('#'+b.getAttribute('popovertarget')),b);return;}if(b.dataset.action)handle(b.dataset.action,b.dataset,b);});
document.addEventListener('keydown',e=>{
  if(e.target.matches('.story-list-item')&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const items=$$('.story-list-item');let index=items.indexOf(e.target);index=e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[index].focus();selectStory(items[index].dataset.id);}
  if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchTab(S.tab==='chats'?'setup':'chats');$(`[data-tab="${S.tab}"]`).focus();}
});
$('#command-search').addEventListener('input',e=>{commandIndex=0;renderSearch(e.target.value);});
$('#command-search').addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown'].includes(e.key)&&commandMatches.length){e.preventDefault();commandIndex=(commandIndex+(e.key==='ArrowDown'?1:-1)+commandMatches.length)%commandMatches.length;renderSearch(e.target.value);$('#search-result-'+commandIndex)?.scrollIntoView({block:'nearest'});}if(e.key==='Enter'){e.preventDefault();chooseSearch(commandIndex);}});
document.addEventListener('input',e=>{if(e.target.name==='title')e.target.setCustomValidity('');if(e.target.id==='list-search'){S.listQuery=e.target.value;const pos=e.target.selectionStart;renderContent();$('#list-search').focus();if(pos!==null)$('#list-search').setSelectionRange(pos,pos);}if(e.target.id==='reading-size')$('#reading-sample').style.fontSize=e.target.value+'px';});
document.addEventListener('change',e=>{if(e.target.id==='import-file')$('#import-note').textContent=e.target.files[0]?e.target.files[0].name+' selected. No file content is read by this draft.':'Choose a PNG or JSON card.';});
document.addEventListener('submit',e=>{
  if(e.target.id==='create-form'){e.preventDefault();const data=new FormData(e.target),name=String(data.get('title')).trim();if(!name){$('input[name=title]',e.target).setCustomValidity('Enter a Story name.');$('input[name=title]',e.target).reportValidity();return;}const s={id:Date.now(),name,kind:S.extras.length%4,chats:0,chat:'Chat 1',messages:0,time:'Just now',mode:String(data.get('mode')),line:data.get('from')==='empty'?'A new world is waiting for its first scene.':'A new story with '+data.get('from')+'.'};S.extras.unshift(s);S.state='normal';$('#state').value='normal';closeSheet();renderSidebar();S.view='story';S.area='home';S.storyId=s.id;renderContent();notify('Story created',()=>{S.extras=S.extras.filter(x=>x.id!==s.id);S.view='home';renderSidebar();renderContent();});}
  if(e.target.id==='new-chat-form'){e.preventDefault();const s=byId(e.target.dataset.id),name=String(new FormData(e.target).get('name')).trim();s.chats++;s.chat=name||'Chat '+s.chats;closeSheet();resume(s.id,s.chat);}
  if(e.target.id==='composer'){e.preventDefault();const field=$('input',e.target),value=field.value.trim();if(!value)return;$('#local-messages').insertAdjacentHTML('beforeend',`<div class="reading-reply"><strong>You</strong><p>${esc(value)}</p></div>`);field.value='';$('#announcement').textContent='Message added to the example conversation';}
});
$('#state').addEventListener('change',e=>{stopMotion();closeMenus();S.state=e.target.value;S.view='home';S.area='home';S.listQuery='';S.compactPreview=false;render();});
$('#reduce').addEventListener('change',()=>{stopMotion();document.documentElement.toggleAttribute('data-reduce',$('#reduce').checked);});
mediaMotion.addEventListener('change',stopMotion);
window.addEventListener('resize',()=>{clearFlight();placeMarker(true);updateNav(true);for(const menu of $$('.action-menu:popover-open')){const trigger=menuTriggers.get(menu.id);if(trigger?.isConnected)positionMenu(menu,trigger);}});
window.addEventListener('hashchange',()=>{const value=location.hash.slice(1);if(['d','e','f'].includes(value)){stopMotion();S.draft=value;S.view='home';S.area='home';render();}});
$('#sidebar-toggle').innerHTML=icon('sidebar');$('#new-trigger').innerHTML=icon('plus');$('#search-icon').innerHTML=icon('search');$('#command-icon').innerHTML=icon('search');$('#command-search').setAttribute('role','combobox');$('#command-search').setAttribute('aria-expanded','true');$('#command-search').setAttribute('aria-controls','command-results');$('#command-search').setAttribute('aria-autocomplete','list');$('#command-results').setAttribute('role','listbox');$('#command-results').setAttribute('aria-label','Search results');if(navigator.platform.toLowerCase().includes('mac'))$('.search-trigger kbd').textContent='⌘ K';document.documentElement.dataset.input='pointer';menuContent();render();
</script>
</body>
</html>
