<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homunculus Motion Draft</title>
<style>
:root{--pg-bg:#141518;--pg-ink:#edf0ed;--pg-ink-2:#afb8b5;--pg-fill:rgba(255,255,255,.07);--pg-fill-on:rgba(255,255,255,.16);--pg-focus:#a7d9c7;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pg-bg:#141518}}
:root[data-theme="dark"]{--pg-bg:#141518}
html,body{margin:0;background:var(--pg-bg);min-height:100%}
.pg{max-width:780px;margin:0 auto;padding:28px 16px 40px;display:grid;gap:18px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--pg-ink-2)}
.pg-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pg-title{font-size:15px;font-weight:700;color:var(--pg-ink)}
.pg-seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--pg-fill)}
.pg-seg button{border:0;background:transparent;color:var(--pg-ink-2);font:inherit;padding:4px 12px;border-radius:6px;cursor:pointer;transition:background .28s cubic-bezier(.22,1,.36,1),color .28s cubic-bezier(.22,1,.36,1)}
.pg-seg button[data-on]{background:var(--pg-fill-on);color:var(--pg-ink);font-weight:600}
.pg-seg button:focus-visible{outline:3px solid var(--pg-focus);outline-offset:1px}
.pg-stage{width:100%}
.pg-notes{margin:0;padding:0 0 0 20px;display:grid;gap:8px}
.pg-notes strong{color:var(--pg-ink);font-weight:600;margin-right:6px}
.pg-foot{margin:0;font-size:12px}
.pg-sec{display:grid;gap:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07)}
.pg-coffra ul{margin:0;padding-left:18px;display:grid;gap:6px}
.pg-coffra strong{color:var(--pg-ink);font-weight:600}
.pg-foot code{font-size:12px;color:var(--pg-ink)}
</style>
